name: Multi Job Workflow

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Lint
        run: |
          echo "Running lint checks..."
          ls -la

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Tests
        run: |
          echo "Running tests..."
          echo "Tests passed"

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Project
        run: |
          echo "Building application..."
          mkdir build
          echo "Build complete"

  deploy:
    needs: [lint, test, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          echo "Deploying application..."
          echo "Deployment successful"
